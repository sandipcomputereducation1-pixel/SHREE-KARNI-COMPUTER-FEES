{% extends "base.html" %}{% block title %}Courses{% endblock %}{% block content %}
<h2 class="fw-bold mb-3">Courses & Fees</h2><div class="card panel mb-4"><div class="card-body"><form method="post" class="row g-2"><div class="col-md-6"><input class="form-control" name="name" placeholder="नया Course नाम" required></div><div class="col-md-3"><input class="form-control" type="number" min="0" step="0.01" name="fee" placeholder="Course Fees ₹" required></div><div class="col-md-3"><button class="btn btn-primary w-100">Add Course</button></div></form></div></div>
<div class="card panel"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Course Name</th><th>Fees (₹)</th><th>Status</th><th>Action</th></tr></thead><tbody>{% for c in courses %}<tr><form method="post" action="{{ url_for('update_course',cid=c.id) }}"><td><input class="form-control" name="name" value="{{ c.name }}"></td><td><input class="form-control" type="number" step="0.01" name="fee" value="{{ c.fee }}"></td><td>{% if c.active %}<span class="badge text-bg-success">Active</span>{% else %}<span class="badge text-bg-secondary">Inactive</span>{% endif %}</td><td class="d-flex gap-2"><button class="btn btn-sm btn-outline-primary">Save</button></form><form method="post" action="{{ url_for('toggle_course',cid=c.id) }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Disable' if c.active else 'Enable' }}</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
